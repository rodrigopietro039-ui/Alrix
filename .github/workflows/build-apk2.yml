name: Build Elrix APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Preparar projeto Android
        run: unzip -q elrix-android-apk-source.zip -d .
      - name: Gerar APK de teste
        run: gradle -p android-app assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: elrix-ai-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
